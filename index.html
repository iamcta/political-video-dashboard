
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectrum | Independent Video Reader</title>
 <style> 
/* Click-to-play video cards */
.thumbnail {
  position: relative;
  cursor: pointer;
}

.thumbnail::after {
  content: "▶";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.75);
  color: white;
  font-size: 23px;
  pointer-events: none;
}

.thumbnail:hover::after {
  background: #c52232;
}

.spectrum-player {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 9 / 12;
  border: 0;
  background: #000;
}

@media (max-width: 600px) {
  .card:has(.spectrum-player) {
    grid-column: 1 / -1;
    max-width: 350px;
  }

  .spectrum-player {
    aspect-ratio: 9 / 13;
  }
}

:root {
  font-family: system-ui, -apple-system, sans-serif;
  color: #222a33;
  background: #f6f7f8;
}
* { box-sizing: border-box; }
body { margin: 0; }
header {
  background: #fff;
  border-bottom: 1px solid #dddfe3;
  padding: 22px max(24px, calc((100% - 1300px)/2));
}
.brand { font-family: Georgia, serif; font-size: 31px; font-weight: bold; }
.subtitle { color: #6b7280; font-size: 13px; margin-top: 5px; }
main { max-width: 1300px; margin: auto; padding: 32px 24px; }
h1 { font-family: Georgia, serif; font-size: 26px; margin: 0 0 8px; }
.description { color: #666; margin: 0 0 25px; line-height: 1.6; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
select, input {
  border: 1px solid #d5d9df;
  background: white;
  color: #222;
  padding: 11px 14px;
  border-radius: 7px;
  font: inherit;
}
input { flex: 1; min-width: 180px; }
.summary { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 22px;
}
.card {
  background: white;
  border: 1px solid #e2e5e9;
  border-radius: 10px;
  overflow: hidden;
}
.thumbnail {
  display: block;
  aspect-ratio: 9 / 12;
  background: #e6e9ec;
  overflow: hidden;
  text-decoration: none;
}
.thumbnail img { width: 100%; height: 100%; object-fit: cover; }
.no-image {
  height: 100%;
  display: grid;
  place-items: center;
  color: #697380;
}
.card-content { padding: 15px; }
.category {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #586579;
}
.video-title {
  font-size: 15px;
  font-weight: 650;
  line-height: 1.45;
  margin: 9px 0;
}
.video-title a { color: inherit; text-decoration: none; }
.video-title a:hover { text-decoration: underline; }
.metadata { font-size: 12px; color: #747b85; line-height: 1.7; }
.message {
  padding: 55px 20px;
  text-align: center;
  color: #68717d;
  border: 1px dashed #cdd3d9;
  background: white;
  border-radius: 10px;
}
footer {
  text-align: center;
  padding: 45px 20px;
  font-size: 12px;
  color: #818792;
}
@media(max-width: 600px) {
  header { padding: 20px; }
  main { padding: 24px 16px; }
  .gallery { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .card-content { padding: 11px; }
  .thumbnail { aspect-ratio: 9/13; }
}
</style>
</head>
<body>

<header>
  <div class="brand">SPECTRUM</div>
  <div class="subtitle">An independent political video reader</div>
</header>

<main>
  <h1>The Video Archive</h1>
  <p class="description">
    Different perspectives. One chronological feed.
    No personalized recommendations or engagement-based ranking.
  </p>

  <div class="filters">
    <select id="category" aria-label="Political perspective">
      <option value="">All perspectives</option>
      <option>Far-Left</option>
      <option>Left</option>
      <option>Center-Left</option>
      <option>Center</option>
      <option>Center-Right</option>
      <option>Right</option>
      <option>Far-Right</option>
      <option>Unclassified</option>
    </select>

    <select id="platform" aria-label="Video platform">
      <option value="">All platforms</option>
      <option value="youtube">YouTube</option>
      <option value="tiktok">TikTok</option>
    </select>

    <input id="search" type="search" placeholder="Search videos or creators">

    <select id="sort" aria-label="Sort videos">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </div>

  <div id="summary" class="summary">Loading video archive...</div>
  <div id="gallery" class="gallery" aria-live="polite"></div>
</main>

<footer>
  Spectrum · Public videos from selected sources ·
  Source categories are manually assigned.
</footer>

<script defer src="./app.js"></script>

</body>
</html>
